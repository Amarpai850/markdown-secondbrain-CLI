services:
  - type: web
    name: brain-search-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    # Singapore is the closest Render region to India (lower latency for demos).
    region: singapore
    branch: main
    autoDeploy: true
    # Render marks a deploy healthy only once this returns HTTP 200.
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: BRAIN_NOTES_DIR
        value: /app/sample_notes
      - key: BRAIN_WEB_DIR
        value: /app/web
