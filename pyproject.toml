[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain"
version = "0.1.0"
description = "Local Markdown Second Brain CLI + Search Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Senior Software Engineer" }]
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
semantic = [
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
]
