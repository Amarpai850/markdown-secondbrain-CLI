<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Brain — Search your notes</title>
  <style>
    /* ---------- Tokens: one accent, 4-point spacing, one radius scale ---------- */
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: #dfe3e9;
      --border-strong: #c9cfd8;
      --text: #12161c;
      --text-2: #48515e;
      --text-3: #677180;
      --accent: #0d7f58;
      --accent-hover: #0a6b4a;
      --accent-soft: rgba(13, 127, 88, 0.10);
      --accent-mark: rgba(13, 127, 88, 0.16);
      --danger: #c2332b;
      --glass: rgba(255, 255, 255, 0.72);
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 8px 24px rgba(16, 24, 40, 0.08);

      --graph-bg: #fbfcfd;
      --graph-node: #8b95a3;
      --graph-edge: rgba(72, 81, 94, 0.22);
      --graph-label: #48515e;

      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
      --r-sm: 6px; --r: 8px; --r-lg: 12px;

      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1116;
        --surface: #151920;
        --surface-2: #1b2029;
        --border: #262c36;
        --border-strong: #353d4a;
        --text: #e9ecf1;
        --text-2: #a7b0bd;
        --text-3: #8690a0;
        --accent: #3dbd8f;
        --accent-hover: #5bcfa4;
        --accent-soft: rgba(61, 189, 143, 0.12);
        --accent-mark: rgba(61, 189, 143, 0.22);
        --danger: #f07167;
        --glass: rgba(21, 25, 32, 0.72);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.45);

        --graph-bg: #0b0e12;
        --graph-node: #5d6776;
        --graph-edge: rgba(167, 176, 189, 0.16);
        --graph-label: #a7b0bd;
      }
    }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    kbd {
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1;
      color: var(--text-3);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 3px 6px;
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: var(--s4);
      padding: var(--s3) var(--s5);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: var(--s2);
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .brand svg { color: var(--accent); flex-shrink: 0; }

    .search-wrapper { flex: 1; max-width: 640px; position: relative; }
    .search-icon {
      position: absolute; left: var(--s3); top: 50%; transform: translateY(-50%);
      color: var(--text-3); pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 40px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 0 var(--s10) 0 var(--s10);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 150ms var(--ease), background-color 150ms var(--ease), box-shadow 150ms var(--ease);
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:hover { border-color: var(--border-strong); }
    .search-input:focus {
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .search-kbd { position: absolute; right: var(--s3); top: 50%; transform: translateY(-50%); pointer-events: none; }
    .search-input:focus ~ .search-kbd { opacity: 0; }

    .controls { display: flex; align-items: center; gap: var(--s3); margin-left: auto; }
    .segmented {
      display: flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 2px;
      gap: 2px;
    }
    .toggle-btn, .view-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--s1);
      height: 32px;
      padding: 0 var(--s3);
      background: transparent;
      border: none;
      border-radius: var(--r-sm);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 550;
      cursor: pointer;
      transition: background-color 150ms var(--ease), color 150ms var(--ease);
    }
    .toggle-btn:hover, .view-btn:hover { color: var(--text); background: var(--surface); }
    .toggle-btn.active, .view-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.10);
    }
    .toggle-btn.active { color: var(--accent); }
    .toggle-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ---------- Layout ---------- */
    main { flex: 1; display: flex; overflow: hidden; position: relative; }
    #searchPane {
      width: 420px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
      padding: 0 var(--s4);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-3);
    }
    #statusIndicator { display: inline-flex; align-items: center; gap: 6px; }
    #statusIndicator::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    }
    #statusIndicator[data-state="busy"]::before { background: var(--text-3); }
    #statusIndicator[data-state="error"] { color: var(--danger); }
    #statusIndicator[data-state="error"]::before { background: var(--danger); }

    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: var(--s3);
      display: flex;
      flex-direction: column;
      gap: var(--s2);
    }

    /* ---------- Result cards: title → where → why it matched ---------- */
    .result-card {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: var(--s3) var(--s4);
      cursor: pointer;
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease), transform 150ms var(--ease);
    }
    .result-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
    .result-card:active { transform: scale(0.995); }
    .result-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .result-top { display: flex; align-items: center; gap: var(--s3); }
    .result-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
    }
    .relevance {
      flex-shrink: 0;
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--surface-2);
      overflow: hidden;
    }
    .relevance > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
    .result-path {
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-3);
    }
    .snippet-text {
      margin-top: var(--s2);
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-2);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .snippet-text mark {
      background: var(--accent-mark);
      color: var(--text);
      font-weight: 600;
      padding: 0 2px;
      border-radius: 3px;
    }
    .result-tags { margin-top: var(--s2); display: flex; flex-wrap: wrap; gap: var(--s1); }
    .tag-chip {
      font-size: 12px;
      color: var(--text-3);
      background: var(--surface-2);
      padding: 1px var(--s2);
      border-radius: var(--r-sm);
    }

    /* ---------- Empty / welcome state ---------- */
    .empty-state { padding: var(--s8) var(--s4); color: var(--text-2); }
    .empty-state h2 {
      font-size: 18px;
      font-weight: 650;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: var(--s2);
    }
    .empty-state p { font-size: 14px; line-height: 1.6; max-width: 36ch; }
    .empty-state.error { color: var(--danger); }
    .suggestions { margin-top: var(--s5); display: flex; flex-wrap: wrap; gap: var(--s2); }
    .suggestion {
      height: 32px;
      padding: 0 var(--s3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 150ms var(--ease), color 150ms var(--ease);
    }
    .suggestion:hover { border-color: var(--accent); color: var(--accent); }
    .hint { margin-top: var(--s6); font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: var(--s4); }
    .hint span { display: inline-flex; align-items: center; gap: 6px; }

    /* ---------- Graph ---------- */
    #graphPane { flex: 1; position: relative; background: var(--graph-bg); overflow: hidden; }
    #graphCanvas { width: 100%; height: 100%; display: block; cursor: grab; }
    #graphCanvas:active { cursor: grabbing; }
    /* The one glass surface: it floats over a moving canvas. */
    .graph-legend {
      position: absolute;
      left: var(--s4);
      bottom: var(--s4);
      display: flex;
      gap: var(--s4);
      padding: var(--s2) var(--s3);
      background: var(--glass);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 12px;
      color: var(--text-2);
      pointer-events: none;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-dot.note { background: var(--graph-node); }
    .legend-dot.hub { background: var(--accent); }
    .legend-dot.orphan { border: 2px solid var(--text-3); }
    .graph-hint {
      position: absolute; right: var(--s4); bottom: var(--s4);
      font-size: 12px; color: var(--text-3); pointer-events: none;
    }

    /* ---------- Note viewer ---------- */
    #noteViewer {
      position: absolute;
      top: 0; right: 0;
      width: min(560px, 100%);
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 240ms var(--ease), visibility 0s linear 240ms;
    }
    #noteViewer.open { transform: translateX(0); visibility: visible; transition: transform 240ms var(--ease); }
    .viewer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--s3);
      padding: var(--s5) var(--s6) var(--s4);
      border-bottom: 1px solid var(--border);
    }
    .viewer-title { font-size: 20px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; }
    .viewer-path { margin-top: var(--s1); font-family: var(--mono); font-size: 12px; color: var(--text-3); }
    #viewerTags { margin-top: var(--s3); }
    .close-btn {
      flex-shrink: 0;
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--r);
      color: var(--text-3);
      cursor: pointer;
      transition: background-color 150ms var(--ease), color 150ms var(--ease);
    }
    .close-btn:hover { background: var(--surface-2); color: var(--text); }
    .viewer-body { flex: 1; overflow-y: auto; padding: var(--s6); display: flex; flex-direction: column; gap: var(--s6); }
    .viewer-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      margin-bottom: var(--s2);
    }
    .links-grid { display: flex; flex-wrap: wrap; gap: var(--s2); font-size: 13px; color: var(--text-3); }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 var(--s3);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 150ms var(--ease), color 150ms var(--ease);
    }
    .link-btn:hover { border-color: var(--accent); color: var(--accent); }
    .link-btn .arrow { color: var(--text-3); }
    .link-btn.tag { height: 28px; padding: 0 var(--s2); color: var(--text-2); background: var(--surface-2); border-color: transparent; }
    .link-btn.tag:hover { color: var(--accent); border-color: transparent; }
    .note-content-box {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 68ch;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      header { flex-wrap: wrap; gap: var(--s3); padding: var(--s3) var(--s4); }
      .search-wrapper { order: 3; flex-basis: 100%; max-width: none; }
      .search-kbd, .view-tabs { display: none; }
      #searchPane { width: 100% !important; border-right: none; display: flex !important; }
      #graphPane { display: none !important; }
      .viewer-header { padding: var(--s4); }
      .viewer-body { padding: var(--s4); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="6" cy="6" r="2.5"></circle>
        <circle cx="18" cy="8" r="2.5"></circle>
        <circle cx="10" cy="18" r="2.5"></circle>
        <path d="M8.3 7.1 15.6 7.6M7.2 8.3 9.1 15.6M16.6 10.1 11.7 16.2"></path>
      </svg>
      <span>Brain</span>
    </div>
    <div class="search-wrapper" role="search">
      <label for="searchInput" class="sr-only">Search notes</label>
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16" y2="16"></line>
      </svg>
      <input type="search" id="searchInput" class="search-input" placeholder="Search notes, ideas or tags" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">/</kbd>
    </div>
    <div class="controls">
      <div class="segmented" role="group" aria-label="Search mode">
        <button id="keywordModeBtn" class="toggle-btn active" title="Ranks notes by the words you type (TF-IDF)">Keyword</button>
        <button id="semanticModeBtn" class="toggle-btn" title="Also finds notes about related ideas, even without your exact words (LSA)">Semantic</button>
      </div>
      <div class="segmented view-tabs" role="group" aria-label="Layout">
        <button id="viewListBtn" class="view-btn">List</button>
        <button id="viewSplitBtn" class="view-btn active">Split</button>
        <button id="viewGraphBtn" class="view-btn">Graph</button>
      </div>
    </div>
  </header>
  <main>
    <section id="searchPane" aria-label="Search results">
      <div class="pane-header">
        <span id="resultsCount">Loading notes…</span>
        <span id="statusIndicator" role="status" aria-live="polite">Ready</span>
      </div>
      <div id="resultsList" class="results-list"></div>
    </section>
    <section id="graphPane" aria-label="Knowledge graph">
      <canvas id="graphCanvas" aria-label="Graph of notes and the links between them. Click a node to open the note."></canvas>
      <div class="graph-legend" aria-hidden="true">
        <div class="legend-item"><span class="legend-dot note"></span>Note</div>
        <div class="legend-item"><span class="legend-dot hub"></span>Hub (5+ links)</div>
        <div class="legend-item"><span class="legend-dot orphan"></span>Orphan (no links)</div>
      </div>
      <div class="graph-hint" aria-hidden="true">Drag to rearrange · click to open</div>
    </section>
    <aside id="noteViewer" aria-label="Note" aria-hidden="true">
      <div class="viewer-header">
        <div>
          <h2 id="viewerTitle" class="viewer-title">Note title</h2>
          <div id="viewerPath" class="viewer-path">path.md</div>
          <div id="viewerTags" class="links-grid"></div>
        </div>
        <button id="closeViewerBtn" class="close-btn" aria-label="Close note (Esc)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"></path>
          </svg>
        </button>
      </div>
      <div class="viewer-body">
        <div id="viewerContent" class="note-content-box"></div>
        <div>
          <div class="viewer-section-title">Links to</div>
          <div id="viewerOutlinks" class="links-grid"></div>
        </div>
        <div>
          <div class="viewer-section-title">Linked from</div>
          <div id="viewerBacklinks" class="links-grid"></div>
        </div>
      </div>
    </aside>
  </main>
  <script>
    const state = {
      query: "",
      semantic: false,
      hasNumpy: true,
      currentResults: [],
      graphData: { nodes: [], edges: [], orphan_notes: [], broken_links: [] }
    };

    const searchInput = document.getElementById("searchInput");
    const keywordModeBtn = document.getElementById("keywordModeBtn");
    const semanticModeBtn = document.getElementById("semanticModeBtn");
    const resultsList = document.getElementById("resultsList");
    const resultsCount = document.getElementById("resultsCount");
    const statusIndicator = document.getElementById("statusIndicator");
    const graphCanvas = document.getElementById("graphCanvas");
    const noteViewer = document.getElementById("noteViewer");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerPath = document.getElementById("viewerPath");
    const viewerTags = document.getElementById("viewerTags");
    const viewerOutlinks = document.getElementById("viewerOutlinks");
    const viewerBacklinks = document.getElementById("viewerBacklinks");
    const viewerContent = document.getElementById("viewerContent");
    const closeViewerBtn = document.getElementById("closeViewerBtn");
    const viewSplitBtn = document.getElementById("viewSplitBtn");
    const viewListBtn = document.getElementById("viewListBtn");
    const viewGraphBtn = document.getElementById("viewGraphBtn");
    const searchPane = document.getElementById("searchPane");
    const graphPane = document.getElementById("graphPane");

    function buildSafeSnippetElement(snippet, highlights) {
      const container = document.createElement("div");
      container.className = "snippet-text";
      if (!snippet) return container;
      if (!highlights || highlights.length === 0) {
        container.textContent = snippet;
        return container;
      }
      const sorted = highlights.slice().sort((a, b) => a[0] - b[0]);
      let cursor = 0;
      for (const [start, end] of sorted) {
        if (start > cursor && start <= snippet.length) {
          container.appendChild(document.createTextNode(snippet.slice(cursor, start)));
        }
        if (end > start && start < snippet.length) {
          const mark = document.createElement("mark");
          mark.textContent = snippet.slice(start, Math.min(end, snippet.length));
          container.appendChild(mark);
        }
        cursor = Math.max(cursor, end);
      }
      if (cursor < snippet.length) {
        container.appendChild(document.createTextNode(snippet.slice(cursor)));
      }
      return container;
    }

    function setStatus(text, stateName) {
      statusIndicator.textContent = text;
      statusIndicator.dataset.state = stateName;
    }

    function debounce(fn, delay) {
      let timer = null;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (res.ok) {
          const data = await res.json();
          state.hasNumpy = !!data.has_numpy;
          resultsCount.textContent = `${data.indexed_notes} notes`;
          if (!state.hasNumpy) {
            semanticModeBtn.disabled = true;
            semanticModeBtn.title = "numpy is not installed on server";
          }
        }
      } catch (err) {
        setStatus("Offline", "error");
      }
    }

    async function executeSearch() {
      const q = searchInput.value.trim();
      state.query = q;
      if (!q) {
        state.currentResults = [];
        renderWelcome();
        renderGraph();
        setStatus("Ready", "ok");
        return;
      }
      setStatus("Searching…", "busy");

      try {
        const url = `/api/search?q=${encodeURIComponent(q)}&k=20&semantic=${state.semantic}`;
        const res = await fetch(url);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }
        const data = await res.json();
        state.currentResults = data.results || [];
        renderResults(state.currentResults);
        renderGraph();
        const n = data.total_results;
        setStatus(`${n} ${n === 1 ? "match" : "matches"}${state.semantic ? " · semantic" : ""}`, "ok");
      } catch (err) {
        resultsList.replaceChildren();
        const errDiv = document.createElement("div");
        errDiv.className = "empty-state error";
        errDiv.textContent = `Search failed: ${err.message}`;
        resultsList.appendChild(errDiv);
        setStatus("Error", "error");
      }
    }

    const SUGGESTIONS = ["spaced repetition", "gradient descent", "zettelkasten", "graph traversal"];

    function renderWelcome() {
      resultsList.replaceChildren();
      const box = document.createElement("div");
      box.className = "empty-state";

      const h = document.createElement("h2");
      h.textContent = "Find any note in milliseconds";
      const p = document.createElement("p");
      p.textContent = "Results are ranked by relevance and show the passage that matched. Open a note to read it and follow its links.";

      const sugg = document.createElement("div");
      sugg.className = "suggestions";
      for (const s of SUGGESTIONS) {
        const b = document.createElement("button");
        b.className = "suggestion";
        b.textContent = s;
        b.addEventListener("click", () => {
          searchInput.value = s;
          executeSearch();
        });
        sugg.appendChild(b);
      }

      const hint = document.createElement("div");
      hint.className = "hint";
      for (const [key, label] of [["/", "Search"], ["Esc", "Close note"]]) {
        const span = document.createElement("span");
        const k = document.createElement("kbd");
        k.textContent = key;
        span.append(k, label);
        hint.appendChild(span);
      }

      box.append(h, p, sugg, hint);
      resultsList.appendChild(box);
    }

    function renderResults(results) {
      resultsList.replaceChildren();
      if (results.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        const h = document.createElement("h2");
        h.textContent = "No matching notes";
        const p = document.createElement("p");
        p.textContent = state.semantic
          ? `Nothing related to "${state.query}". Try fewer or broader words.`
          : `No note mentions "${state.query}". Try Semantic mode to find related ideas.`;
        empty.append(h, p);
        resultsList.appendChild(empty);
        return;
      }
      const top = results[0].score || 1;
      for (const item of results) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "result-card";
        card.dataset.path = item.path;
        card.addEventListener("click", () => openNote(item.path));

        const row = document.createElement("div");
        row.className = "result-top";
        const title = document.createElement("div");
        title.className = "result-title";
        title.textContent = item.title || item.path;
        const rel = document.createElement("div");
        rel.className = "relevance";
        rel.title = `Relevance ${item.score.toFixed(3)}`;
        const fill = document.createElement("span");
        fill.style.width = `${Math.max(8, Math.round((item.score / top) * 100))}%`;
        rel.appendChild(fill);
        row.append(title, rel);

        const path = document.createElement("div");
        path.className = "result-path";
        path.textContent = item.path;

        card.append(row, path, buildSafeSnippetElement(item.snippet, item.highlights));

        if (item.tags && item.tags.length > 0) {
          const tags = document.createElement("div");
          tags.className = "result-tags";
          for (const t of item.tags.slice(0, 3)) {
            const chip = document.createElement("span");
            chip.className = "tag-chip";
            chip.textContent = `#${t}`;
            tags.appendChild(chip);
          }
          if (item.tags.length > 3) {
            const more = document.createElement("span");
            more.className = "tag-chip";
            more.textContent = `+${item.tags.length - 3}`;
            tags.appendChild(more);
          }
          card.appendChild(tags);
        }
        resultsList.appendChild(card);
      }
    }

    function noteLabel(path) {
      return String(path).replace(/\.md$/i, "");
    }

    function linkButton(path, arrow) {
      const btn = document.createElement("button");
      btn.className = "link-btn";
      const a = document.createElement("span");
      a.className = "arrow";
      a.setAttribute("aria-hidden", "true");
      a.textContent = arrow;
      btn.append(a, noteLabel(path));
      btn.addEventListener("click", () => openNote(path));
      return btn;
    }

    function fillLinks(container, links, arrow, emptyText) {
      container.replaceChildren();
      if (links && links.length > 0) {
        for (const link of links) container.appendChild(linkButton(link, arrow));
      } else {
        container.textContent = emptyText;
      }
    }

    async function openNote(noteName) {
      try {
        const res = await fetch(`/api/note/${encodeURIComponent(noteName)}`);
        if (!res.ok) throw new Error("Note not found");
        const doc = await res.json();

        viewerTitle.textContent = doc.title || doc.path;
        viewerPath.textContent = doc.path;
        viewerContent.textContent = (doc.body ?? doc.content) || "This note is empty.";

        viewerTags.replaceChildren();
        for (const tag of doc.tags || []) {
          const btn = document.createElement("button");
          btn.className = "link-btn tag";
          btn.textContent = `#${tag}`;
          btn.title = `Search for #${tag}`;
          btn.addEventListener("click", () => {
            searchInput.value = tag;
            executeSearch();
          });
          viewerTags.appendChild(btn);
        }

        fillLinks(viewerOutlinks, doc.outlinks, "→", "This note doesn't link to other notes.");
        fillLinks(viewerBacklinks, doc.backlinks, "←", "No other note links here yet.");

        for (const c of resultsList.querySelectorAll(".result-card")) {
          c.classList.toggle("selected", c.dataset.path === doc.path);
        }
        noteViewer.querySelector(".viewer-body").scrollTop = 0;
        noteViewer.classList.add("open");
        noteViewer.setAttribute("aria-hidden", "false");
      } catch (err) {
        console.error("Failed to load note:", err);
      }
    }

    function closeViewer() {
      noteViewer.classList.remove("open");
      noteViewer.setAttribute("aria-hidden", "true");
      for (const c of resultsList.querySelectorAll(".result-card.selected")) c.classList.remove("selected");
    }

    closeViewerBtn.addEventListener("click", closeViewer);

    document.addEventListener("keydown", (e) => {
      const typing = e.target instanceof HTMLElement && e.target.matches("input, textarea, [contenteditable]");
      if (e.key === "/" && !typing) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if (e.key === "Escape") {
        if (noteViewer.classList.contains("open")) closeViewer();
        else if (document.activeElement === searchInput && searchInput.value) {
          searchInput.value = "";
          executeSearch();
        }
      }
    });

    keywordModeBtn.addEventListener("click", () => {
      state.semantic = false;
      keywordModeBtn.classList.add("active");
      semanticModeBtn.classList.remove("active");
      executeSearch();
    });

    semanticModeBtn.addEventListener("click", () => {
      if (!state.hasNumpy) return;
      state.semantic = true;
      semanticModeBtn.classList.add("active");
      keywordModeBtn.classList.remove("active");
      executeSearch();
    });

    viewSplitBtn.addEventListener("click", () => {
      searchPane.style.display = "flex";
      searchPane.style.width = "420px";
      graphPane.style.display = "block";
      viewSplitBtn.classList.add("active");
      viewListBtn.classList.remove("active");
      viewGraphBtn.classList.remove("active");
      resizeCanvas();
    });

    viewListBtn.addEventListener("click", () => {
      searchPane.style.display = "flex";
      searchPane.style.width = "100%";
      graphPane.style.display = "none";
      viewListBtn.classList.add("active");
      viewSplitBtn.classList.remove("active");
      viewGraphBtn.classList.remove("active");
    });

    viewGraphBtn.addEventListener("click", () => {
      searchPane.style.display = "none";
      graphPane.style.display = "block";
      viewGraphBtn.classList.add("active");
      viewSplitBtn.classList.remove("active");
      viewListBtn.classList.remove("active");
      resizeCanvas();
    });

    searchInput.addEventListener("input", debounce(executeSearch, 220));

    // Force-directed Canvas Graph
    const ctx = graphCanvas.getContext("2d");
    let simulation = {
      nodes: [],
      edges: [],
      alpha: 1.0,
      animId: null,
      width: 0,
      height: 0,
      draggedNode: null,
      hoveredNode: null,
    };

    function resizeCanvas() {
      const rect = graphPane.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      // Keep the layout centred when the pane changes size (e.g. Split -> Graph).
      if (simulation.width && simulation.height) {
        const shiftX = (rect.width - simulation.width) / 2;
        const shiftY = (rect.height - simulation.height) / 2;
        for (const n of simulation.nodes) { n.x += shiftX; n.y += shiftY; }
      }
      simulation.width = rect.width;
      simulation.height = rect.height;
      graphCanvas.width = rect.width * dpr;
      graphCanvas.height = rect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      wakeSimulation(0.3);
    }

    window.addEventListener("resize", resizeCanvas);

    async function loadGraphData() {
      try {
        const res = await fetch("/api/graph");
        if (!res.ok) return;
        const data = await res.json();
        state.graphData = data;
        resultsCount.textContent = `${(data.nodes || []).length} notes · ${(data.edges || []).length} links`;
        initSimulation(data);
      } catch (err) {
        console.error("Failed to load graph data:", err);
      }
    }

    function initSimulation(data) {
      const orphanSet = new Set(data.orphan_notes || []);
      const brokenMap = new Map();
      for (const b of data.broken_links || []) {
        brokenMap.set(`${b.source}->${b.target}`, true);
      }

      const nodeMap = new Map();
      const nodes = (data.nodes || []).map((n, i) => {
        const angle = (i / (data.nodes.length || 1)) * Math.PI * 2;
        const radius = 130 + Math.random() * 80;
        const obj = {
          id: n.id,
          title: n.title || n.id,
          degree: n.degree || 0,
          isOrphan: orphanSet.has(n.id),
          x: (simulation.width || 600) / 2 + Math.cos(angle) * radius,
          y: (simulation.height || 400) / 2 + Math.sin(angle) * radius,
          vx: 0,
          vy: 0,
          radius: Math.max(5, Math.min(14, 5 + (n.degree || 0) * 0.9)),
        };
        nodeMap.set(n.id, obj);
        return obj;
      });

      const edges = [];
      for (const e of data.edges || []) {
        const s = nodeMap.get(e.source);
        const t = nodeMap.get(e.target);
        if (s && t) {
          edges.push({
            source: s,
            target: t,
            isBroken: brokenMap.has(`${e.source}->${e.target}`),
          });
        }
      }

      simulation.nodes = nodes;
      simulation.edges = edges;
      wakeSimulation(1.0);
    }

    function wakeSimulation(alpha = 0.5) {
      simulation.alpha = Math.max(simulation.alpha, alpha);
      if (!simulation.animId) {
        simulation.animId = requestAnimationFrame(tickSimulation);
      }
    }

    function tickSimulation() {
      const { nodes, edges, width, height } = simulation;
      if (simulation.alpha > 0.005) {
        const cx = width / 2;
        const cy = height / 2;

        for (const n of nodes) {
          if (n === simulation.draggedNode) continue;
          n.vx += (cx - n.x) * 0.0006 * simulation.alpha;
          n.vy += (cy - n.y) * 0.0006 * simulation.alpha;
          n.vx *= 0.86;
          n.vy *= 0.86;
        }

        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i];
            const b = nodes[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distSq = dx * dx + dy * dy + 100;
            const dist = Math.sqrt(distSq);
            const force = (2400 / distSq) * simulation.alpha;
            const fx = (dx / dist) * force;
            const fy = (dy / dist) * force;

            if (a !== simulation.draggedNode) { a.x -= fx; a.y -= fy; }
            if (b !== simulation.draggedNode) { b.x += fx; b.y += fy; }
          }
        }

        for (const e of edges) {
          const a = e.source;
          const b = e.target;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const targetDist = 70;
          // Spring: stretched links (dist > targetDist) pull the endpoints together.
          const force = (dist - targetDist) * 0.035 * simulation.alpha;
          const fx = (dx / dist) * force;
          const fy = (dy / dist) * force;

          if (a !== simulation.draggedNode) { a.x += fx; a.y += fy; }
          if (b !== simulation.draggedNode) { b.x -= fx; b.y -= fy; }
        }

        for (const n of nodes) {
          if (n === simulation.draggedNode) continue;
          n.x += n.vx;
          n.y += n.vy;
        }
        simulation.alpha *= 0.96;
      }

      renderGraph();

      if (simulation.alpha > 0.005 || simulation.draggedNode) {
        simulation.animId = requestAnimationFrame(tickSimulation);
      } else {
        simulation.animId = null;
      }
    }

    let palette = null;
    function readPalette() {
      const css = getComputedStyle(document.documentElement);
      const v = (name) => css.getPropertyValue(name).trim();
      palette = {
        node: v("--graph-node"),
        hub: v("--accent"),
        edge: v("--graph-edge"),
        label: v("--graph-label"),
        text: v("--text"),
        orphan: v("--text-3"),
        bg: v("--graph-bg"),
        font: v("--font"),
      };
    }
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      readPalette();
      renderGraph();
    });

    function renderGraph() {
      if (!palette) readPalette();
      ctx.clearRect(0, 0, simulation.width, simulation.height);

      ctx.lineWidth = 1;
      for (const e of simulation.edges) {
        ctx.beginPath();
        ctx.moveTo(e.source.x, e.source.y);
        ctx.lineTo(e.target.x, e.target.y);
        ctx.setLineDash(e.isBroken ? [4, 4] : []);
        ctx.strokeStyle = palette.edge;
        ctx.stroke();
      }
      ctx.setLineDash([]);

      const active = simulation.hoveredNode || simulation.draggedNode;
      // Notes in the current results are highlighted; everything else steps back.
      const matched = new Set((state.currentResults || []).map((r) => r.path));
      const searching = matched.size > 0;
      for (const n of simulation.nodes) {
        const isMatch = matched.has(n.id);
        ctx.globalAlpha = searching && !isMatch && n !== active ? 0.35 : 1;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        if (n.isOrphan) {
          ctx.fillStyle = palette.bg;
          ctx.fill();
          ctx.strokeStyle = palette.orphan;
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          ctx.fillStyle = n.degree >= 5 || n === active || isMatch ? palette.hub : palette.node;
          ctx.fill();
        }

        if (n === active) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius + 4, 0, Math.PI * 2);
          ctx.strokeStyle = palette.hub;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Label only what matters so names stay readable: hubs, orphans,
        // search matches and the node under the cursor. Others show on hover.
        const showLabel = n === active || isMatch || (!searching && (n.degree >= 5 || n.isOrphan));
        if (showLabel) {
          ctx.font = `${n === active || isMatch ? 600 : 400} 12px ${palette.font}`;
          ctx.fillStyle = n === active || isMatch ? palette.text : palette.label;
          ctx.textAlign = "center";
          ctx.fillText(n.title, n.x, n.y + n.radius + 14);
        }
      }
      ctx.globalAlpha = 1;
    }

    function findNodeAt(x, y) {
      for (let i = simulation.nodes.length - 1; i >= 0; i--) {
        const n = simulation.nodes[i];
        const dx = n.x - x;
        const dy = n.y - y;
        if (dx * dx + dy * dy <= (n.radius + 5) * (n.radius + 5)) {
          return n;
        }
      }
      return null;
    }

    let isMouseDown = false;
    let didDrag = false;

    graphCanvas.addEventListener("mousedown", (e) => {
      const rect = graphCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const node = findNodeAt(x, y);
      isMouseDown = true;
      didDrag = false;
      if (node) {
        simulation.draggedNode = node;
        node.x = x;
        node.y = y;
        wakeSimulation(0.4);
      }
    });

    graphCanvas.addEventListener("mousemove", (e) => {
      const rect = graphCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (isMouseDown && simulation.draggedNode) {
        didDrag = true;
        simulation.draggedNode.x = x;
        simulation.draggedNode.y = y;
        simulation.draggedNode.vx = 0;
        simulation.draggedNode.vy = 0;
        wakeSimulation(0.3);
      } else {
        const hovered = findNodeAt(x, y);
        if (hovered !== simulation.hoveredNode) {
          simulation.hoveredNode = hovered;
          renderGraph();
        }
      }
    });

    window.addEventListener("mouseup", (e) => {
      if (isMouseDown && !didDrag && simulation.draggedNode) {
        openNote(simulation.draggedNode.id);
      }
      isMouseDown = false;
      simulation.draggedNode = null;
      didDrag = false;
    });

    window.addEventListener("DOMContentLoaded", async () => {
      renderWelcome();
      resizeCanvas();
      await checkHealth();
      await loadGraphData();
    });
  </script>
</body>
</html>
