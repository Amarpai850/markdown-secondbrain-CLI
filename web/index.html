<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain — Second Brain & Knowledge Graph</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-hover: #1f293d;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.25);
      --amber: #f59e0b;
      --rose: #f43f5e;
      --emerald: #10b981;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font: "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
    }
    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0b0f19;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .search-wrapper {
      flex: 1;
      max-width: 580px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px 9px 36px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px var(--cyan-glow);
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toggle-group, .view-tabs {
      display: flex;
      background: #060911;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
    }
    .toggle-btn, .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .toggle-btn.active {
      background: var(--surface-hover);
      color: var(--cyan);
    }
    .toggle-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .view-btn.active {
      background: #1e293b;
      color: var(--text);
    }
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    #searchPane {
      width: 440px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .pane-header {
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .results-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .result-card:hover {
      background: var(--surface-hover);
      border-color: var(--cyan);
    }
    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
      gap: 8px;
    }
    .result-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.3;
    }
    .score-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      font-family: var(--code-font);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .result-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag-chip {
      background: #1e293b;
      color: #cbd5e1;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
    }
    .snippet-text {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.45;
    }
    .snippet-text mark {
      background: rgba(245, 158, 11, 0.25);
      color: #fde68a;
      font-weight: 600;
      padding: 0 2px;
      border-radius: 2px;
    }
    #graphPane {
      flex: 1;
      position: relative;
      background: #070a12;
      overflow: hidden;
    }
    #graphCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #graphCanvas:active {
      cursor: grabbing;
    }
    .graph-legend {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    #noteViewer {
      position: absolute;
      top: 0;
      right: 0;
      width: 520px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    }
    #noteViewer.open {
      transform: translateX(0);
    }
    .viewer-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .viewer-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .viewer-path {
      font-size: 0.78rem;
      font-family: var(--code-font);
      color: var(--cyan);
      margin-top: 4px;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .close-btn:hover { color: var(--text); }
    .viewer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .viewer-section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .link-btn {
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--cyan);
      font-size: 0.8rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .link-btn:hover {
      background: var(--cyan-glow);
      border-color: var(--cyan);
    }
    .note-content-box {
      background: #080c14;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-size: 0.86rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    @media (max-width: 800px) {
      #searchPane { width: 100%; border-right: none; }
      #graphPane { display: none; }
      #noteViewer { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🧠 Brain</span>
      <span class="brand-badge">Second Brain</span>
    </div>
    <div class="search-wrapper">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search notes, concepts, tags... (e.g. 'machine learning', 'zettelkasten')" autocomplete="off">
    </div>
    <div class="controls">
      <div class="toggle-group" title="Toggle Search Mode">
        <button id="keywordModeBtn" class="toggle-btn active">Keyword (TF-IDF)</button>
        <button id="semanticModeBtn" class="toggle-btn">Semantic (LSA)</button>
      </div>
      <div class="view-tabs">
        <button id="viewSplitBtn" class="view-btn active">Split</button>
        <button id="viewListBtn" class="view-btn">List</button>
        <button id="viewGraphBtn" class="view-btn">Graph</button>
      </div>
    </div>
  </header>
  <main>
    <section id="searchPane">
      <div class="pane-header">
        <span id="resultsCount">0 notes indexed</span>
        <span id="statusIndicator" style="color: var(--emerald);">Ready</span>
      </div>
      <div id="resultsList" class="results-list">
        <div class="empty-state">Enter a search query above to explore notes.</div>
      </div>
    </section>
    <section id="graphPane">
      <canvas id="graphCanvas"></canvas>
      <div class="graph-legend">
        <div class="legend-item"><div class="legend-dot" style="background: var(--cyan);"></div> Note Node</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--amber);"></div> Orphan Note (Isolated)</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--rose);"></div> Broken Target</div>
      </div>
    </section>
    <aside id="noteViewer">
      <div class="viewer-header">
        <div>
          <div id="viewerTitle" class="viewer-title">Note Title</div>
          <div id="viewerPath" class="viewer-path">path.md</div>
        </div>
        <button id="closeViewerBtn" class="close-btn">&times;</button>
      </div>
      <div class="viewer-body">
        <div>
          <div class="viewer-section-title">Tags</div>
          <div id="viewerTags" class="links-grid"></div>
        </div>
        <div>
          <div class="viewer-section-title">Outgoing Links</div>
          <div id="viewerOutlinks" class="links-grid"></div>
        </div>
        <div>
          <div class="viewer-section-title">Backlinks (Incoming)</div>
          <div id="viewerBacklinks" class="links-grid"></div>
        </div>
        <div>
          <div class="viewer-section-title">Note Content</div>
          <div id="viewerContent" class="note-content-box"></div>
        </div>
      </div>
    </aside>
  </main>
  <script>
    const state = {
      query: "",
      semantic: false,
      hasNumpy: true,
      currentResults: [],
      graphData: { nodes: [], edges: [], orphan_notes: [], broken_links: [] }
    };

    const searchInput = document.getElementById("searchInput");
    const keywordModeBtn = document.getElementById("keywordModeBtn");
    const semanticModeBtn = document.getElementById("semanticModeBtn");
    const resultsList = document.getElementById("resultsList");
    const resultsCount = document.getElementById("resultsCount");
    const statusIndicator = document.getElementById("statusIndicator");
    const graphCanvas = document.getElementById("graphCanvas");
    const noteViewer = document.getElementById("noteViewer");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerPath = document.getElementById("viewerPath");
    const viewerTags = document.getElementById("viewerTags");
    const viewerOutlinks = document.getElementById("viewerOutlinks");
    const viewerBacklinks = document.getElementById("viewerBacklinks");
    const viewerContent = document.getElementById("viewerContent");
    const closeViewerBtn = document.getElementById("closeViewerBtn");
    const viewSplitBtn = document.getElementById("viewSplitBtn");
    const viewListBtn = document.getElementById("viewListBtn");
    const viewGraphBtn = document.getElementById("viewGraphBtn");
    const searchPane = document.getElementById("searchPane");
    const graphPane = document.getElementById("graphPane");

    function buildSafeSnippetElement(snippet, highlights) {
      const container = document.createElement("div");
      container.className = "snippet-text";
      if (!snippet) return container;
      if (!highlights || highlights.length === 0) {
        container.textContent = snippet;
        return container;
      }
      const sorted = highlights.slice().sort((a, b) => a[0] - b[0]);
      let cursor = 0;
      for (const [start, end] of sorted) {
        if (start > cursor && start <= snippet.length) {
          container.appendChild(document.createTextNode(snippet.slice(cursor, start)));
        }
        if (end > start && start < snippet.length) {
          const mark = document.createElement("mark");
          mark.textContent = snippet.slice(start, Math.min(end, snippet.length));
          container.appendChild(mark);
        }
        cursor = Math.max(cursor, end);
      }
      if (cursor < snippet.length) {
        container.appendChild(document.createTextNode(snippet.slice(cursor)));
      }
      return container;
    }

    function debounce(fn, delay) {
      let timer = null;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (res.ok) {
          const data = await res.json();
          state.hasNumpy = !!data.has_numpy;
          resultsCount.textContent = `${data.indexed_notes} notes indexed`;
          if (!state.hasNumpy) {
            semanticModeBtn.disabled = true;
            semanticModeBtn.title = "numpy is not installed on server";
          }
        }
      } catch (err) {
        statusIndicator.textContent = "Offline";
        statusIndicator.style.color = "var(--rose)";
      }
    }

    async function executeSearch() {
      const q = searchInput.value.trim();
      state.query = q;
      if (!q) {
        resultsList.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Enter a search query above to explore notes.";
        resultsList.appendChild(empty);
        return;
      }
      statusIndicator.textContent = "Searching...";
      statusIndicator.style.color = "var(--cyan)";

      try {
        const url = `/api/search?q=${encodeURIComponent(q)}&k=20&semantic=${state.semantic}`;
        const res = await fetch(url);
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }
        const data = await res.json();
        state.currentResults = data.results || [];
        renderResults(state.currentResults);
        statusIndicator.textContent = `${data.total_results} found`;
        statusIndicator.style.color = "var(--emerald)";
      } catch (err) {
        resultsList.innerHTML = "";
        const errDiv = document.createElement("div");
        errDiv.className = "empty-state";
        errDiv.style.color = "var(--rose)";
        errDiv.textContent = `Search error: ${err.message}`;
        resultsList.appendChild(errDiv);
        statusIndicator.textContent = "Error";
        statusIndicator.style.color = "var(--rose)";
      }
    }

    function renderResults(results) {
      resultsList.innerHTML = "";
      if (results.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = `No notes found matching "${state.query}".`;
        resultsList.appendChild(empty);
        return;
      }
      for (const item of results) {
        const card = document.createElement("div");
        card.className = "result-card";
        card.addEventListener("click", () => openNote(item.path));

        const top = document.createElement("div");
        top.className = "result-top";

        const title = document.createElement("div");
        title.className = "result-title";
        title.textContent = item.title || item.path;

        const score = document.createElement("div");
        score.className = "score-badge";
        score.textContent = item.score.toFixed(4);

        top.appendChild(title);
        top.appendChild(score);
        card.appendChild(top);

        const meta = document.createElement("div");
        meta.className = "result-meta";
        const pathSpan = document.createElement("span");
        pathSpan.textContent = item.path;
        meta.appendChild(pathSpan);

        if (item.tags && item.tags.length > 0) {
          for (const t of item.tags) {
            const chip = document.createElement("span");
            chip.className = "tag-chip";
            chip.textContent = `#${t}`;
            meta.appendChild(chip);
          }
        }
        card.appendChild(meta);
        card.appendChild(buildSafeSnippetElement(item.snippet, item.highlights));
        resultsList.appendChild(card);
      }
    }

    async function openNote(noteName) {
      try {
        const res = await fetch(`/api/note/${encodeURIComponent(noteName)}`);
        if (!res.ok) throw new Error("Note not found");
        const doc = await res.json();

        viewerTitle.textContent = doc.title || doc.path;
        viewerPath.textContent = doc.path;
        viewerContent.textContent = doc.content || "No content.";

        viewerTags.innerHTML = "";
        if (doc.tags && doc.tags.length > 0) {
          for (const tag of doc.tags) {
            const btn = document.createElement("button");
            btn.className = "link-btn";
            btn.textContent = `#${tag}`;
            btn.addEventListener("click", () => {
              searchInput.value = tag;
              executeSearch();
            });
            viewerTags.appendChild(btn);
          }
        } else {
          viewerTags.textContent = "None";
        }

        viewerOutlinks.innerHTML = "";
        if (doc.outlinks && doc.outlinks.length > 0) {
          for (const link of doc.outlinks) {
            const btn = document.createElement("button");
            btn.className = "link-btn";
            btn.textContent = `-> ${link}`;
            btn.addEventListener("click", () => openNote(link));
            viewerOutlinks.appendChild(btn);
          }
        } else {
          viewerOutlinks.textContent = "None";
        }

        viewerBacklinks.innerHTML = "";
        if (doc.backlinks && doc.backlinks.length > 0) {
          for (const link of doc.backlinks) {
            const btn = document.createElement("button");
            btn.className = "link-btn";
            btn.textContent = `<- ${link}`;
            btn.addEventListener("click", () => openNote(link));
            viewerBacklinks.appendChild(btn);
          }
        } else {
          viewerBacklinks.textContent = "None";
        }

        noteViewer.classList.add("open");
      } catch (err) {
        console.error("Failed to load note:", err);
      }
    }

    closeViewerBtn.addEventListener("click", () => {
      noteViewer.classList.remove("open");
    });

    keywordModeBtn.addEventListener("click", () => {
      state.semantic = false;
      keywordModeBtn.classList.add("active");
      semanticModeBtn.classList.remove("active");
      executeSearch();
    });

    semanticModeBtn.addEventListener("click", () => {
      if (!state.hasNumpy) return;
      state.semantic = true;
      semanticModeBtn.classList.add("active");
      keywordModeBtn.classList.remove("active");
      executeSearch();
    });

    viewSplitBtn.addEventListener("click", () => {
      searchPane.style.display = "flex";
      searchPane.style.width = "440px";
      graphPane.style.display = "block";
      viewSplitBtn.classList.add("active");
      viewListBtn.classList.remove("active");
      viewGraphBtn.classList.remove("active");
      resizeCanvas();
    });

    viewListBtn.addEventListener("click", () => {
      searchPane.style.display = "flex";
      searchPane.style.width = "100%";
      graphPane.style.display = "none";
      viewListBtn.classList.add("active");
      viewSplitBtn.classList.remove("active");
      viewGraphBtn.classList.remove("active");
    });

    viewGraphBtn.addEventListener("click", () => {
      searchPane.style.display = "none";
      graphPane.style.display = "block";
      viewGraphBtn.classList.add("active");
      viewSplitBtn.classList.remove("active");
      viewListBtn.classList.remove("active");
      resizeCanvas();
    });

    searchInput.addEventListener("input", debounce(executeSearch, 220));

    // Force-directed Canvas Graph
    const ctx = graphCanvas.getContext("2d");
    let simulation = {
      nodes: [],
      edges: [],
      alpha: 1.0,
      animId: null,
      width: 0,
      height: 0,
      draggedNode: null,
      hoveredNode: null,
    };

    function resizeCanvas() {
      const rect = graphPane.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      simulation.width = rect.width;
      simulation.height = rect.height;
      graphCanvas.width = rect.width * dpr;
      graphCanvas.height = rect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      wakeSimulation(0.3);
    }

    window.addEventListener("resize", resizeCanvas);

    async function loadGraphData() {
      try {
        const res = await fetch("/api/graph");
        if (!res.ok) return;
        const data = await res.json();
        state.graphData = data;
        initSimulation(data);
      } catch (err) {
        console.error("Failed to load graph data:", err);
      }
    }

    function initSimulation(data) {
      const orphanSet = new Set(data.orphan_notes || []);
      const brokenMap = new Map();
      for (const b of data.broken_links || []) {
        brokenMap.set(`${b.source}->${b.target}`, true);
      }

      const nodeMap = new Map();
      const nodes = (data.nodes || []).map((n, i) => {
        const angle = (i / (data.nodes.length || 1)) * Math.PI * 2;
        const radius = 130 + Math.random() * 80;
        const obj = {
          id: n.id,
          title: n.title || n.id,
          degree: n.degree || 0,
          isOrphan: orphanSet.has(n.id),
          x: (simulation.width || 600) / 2 + Math.cos(angle) * radius,
          y: (simulation.height || 400) / 2 + Math.sin(angle) * radius,
          vx: 0,
          vy: 0,
          radius: Math.max(5, Math.min(14, 5 + (n.degree || 0) * 0.9)),
        };
        nodeMap.set(n.id, obj);
        return obj;
      });

      const edges = [];
      for (const e of data.edges || []) {
        const s = nodeMap.get(e.source);
        const t = nodeMap.get(e.target);
        if (s && t) {
          edges.push({
            source: s,
            target: t,
            isBroken: brokenMap.has(`${e.source}->${e.target}`),
          });
        }
      }

      simulation.nodes = nodes;
      simulation.edges = edges;
      wakeSimulation(1.0);
    }

    function wakeSimulation(alpha = 0.5) {
      simulation.alpha = Math.max(simulation.alpha, alpha);
      if (!simulation.animId) {
        simulation.animId = requestAnimationFrame(tickSimulation);
      }
    }

    function tickSimulation() {
      const { nodes, edges, width, height } = simulation;
      if (simulation.alpha > 0.005) {
        const cx = width / 2;
        const cy = height / 2;

        for (const n of nodes) {
          if (n === simulation.draggedNode) continue;
          n.vx += (cx - n.x) * 0.0006 * simulation.alpha;
          n.vy += (cy - n.y) * 0.0006 * simulation.alpha;
          n.vx *= 0.86;
          n.vy *= 0.86;
        }

        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i];
            const b = nodes[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const distSq = dx * dx + dy * dy + 100;
            const dist = Math.sqrt(distSq);
            const force = (550 / distSq) * simulation.alpha;
            const fx = (dx / dist) * force;
            const fy = (dy / dist) * force;

            if (a !== simulation.draggedNode) { a.x -= fx; a.y -= fy; }
            if (b !== simulation.draggedNode) { b.x += fx; b.y += fy; }
          }
        }

        for (const e of edges) {
          const a = e.source;
          const b = e.target;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const targetDist = 70;
          const force = (dist - targetDist) * 0.035 * simulation.alpha;
          const fx = (dx / dist) * force;
          const fy = (dy / dist) * force;

          if (a !== simulation.draggedNode) { a.x -= fx; a.y -= fy; }
          if (b !== simulation.draggedNode) { b.x += fx; b.y += fy; }
        }

        for (const n of nodes) {
          if (n === simulation.draggedNode) continue;
          n.x += n.vx;
          n.y += n.vy;
        }
        simulation.alpha *= 0.96;
      }

      renderGraph();

      if (simulation.alpha > 0.005 || simulation.draggedNode) {
        simulation.animId = requestAnimationFrame(tickSimulation);
      } else {
        simulation.animId = null;
      }
    }

    function renderGraph() {
      ctx.clearRect(0, 0, simulation.width, simulation.height);

      for (const e of simulation.edges) {
        ctx.beginPath();
        ctx.moveTo(e.source.x, e.source.y);
        ctx.lineTo(e.target.x, e.target.y);
        if (e.isBroken) {
          ctx.strokeStyle = "rgba(239, 68, 68, 0.6)";
          ctx.setLineDash([4, 4]);
        } else {
          ctx.strokeStyle = "rgba(148, 163, 184, 0.18)";
          ctx.setLineDash([]);
        }
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.setLineDash([]);

      for (const n of simulation.nodes) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);

        if (n.isOrphan) {
          ctx.fillStyle = "#f59e0b";
          ctx.fill();
          ctx.strokeStyle = "#fbbf24";
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (n.degree >= 5) {
          ctx.fillStyle = "#38bdf8";
          ctx.shadowColor = "rgba(56, 189, 248, 0.5)";
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = "#0284c7";
          ctx.fill();
        }

        if (n === simulation.hoveredNode || n === simulation.draggedNode) {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius + 4, 0, Math.PI * 2);
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.font = "11px -apple-system, sans-serif";
        ctx.fillStyle = n === simulation.hoveredNode ? "#f8fafc" : "#94a3b8";
        ctx.textAlign = "center";
        ctx.fillText(n.title, n.x, n.y + n.radius + 13);
      }
    }

    function findNodeAt(x, y) {
      for (let i = simulation.nodes.length - 1; i >= 0; i--) {
        const n = simulation.nodes[i];
        const dx = n.x - x;
        const dy = n.y - y;
        if (dx * dx + dy * dy <= (n.radius + 5) * (n.radius + 5)) {
          return n;
        }
      }
      return null;
    }

    let isMouseDown = false;
    let didDrag = false;

    graphCanvas.addEventListener("mousedown", (e) => {
      const rect = graphCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const node = findNodeAt(x, y);
      isMouseDown = true;
      didDrag = false;
      if (node) {
        simulation.draggedNode = node;
        node.x = x;
        node.y = y;
        wakeSimulation(0.4);
      }
    });

    graphCanvas.addEventListener("mousemove", (e) => {
      const rect = graphCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      if (isMouseDown && simulation.draggedNode) {
        didDrag = true;
        simulation.draggedNode.x = x;
        simulation.draggedNode.y = y;
        simulation.draggedNode.vx = 0;
        simulation.draggedNode.vy = 0;
        wakeSimulation(0.3);
      } else {
        const hovered = findNodeAt(x, y);
        if (hovered !== simulation.hoveredNode) {
          simulation.hoveredNode = hovered;
          renderGraph();
        }
      }
    });

    window.addEventListener("mouseup", (e) => {
      if (isMouseDown && !didDrag && simulation.draggedNode) {
        openNote(simulation.draggedNode.id);
      }
      isMouseDown = false;
      simulation.draggedNode = null;
      didDrag = false;
    });

    window.addEventListener("DOMContentLoaded", async () => {
      resizeCanvas();
      await checkHealth();
      await loadGraphData();
    });
  </script>
</body>
</html>
